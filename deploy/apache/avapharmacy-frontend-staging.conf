<VirtualHost *:80>
    ServerName app-staging.avapharmacy.co.ke

    DocumentRoot /var/www/avapharmacy-frontend-staging

    ErrorLog ${APACHE_LOG_DIR}/avapharmacy-frontend-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/avapharmacy-frontend-staging-access.log combined

    <Directory /var/www/avapharmacy-frontend-staging>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    <FilesMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</VirtualHost>
